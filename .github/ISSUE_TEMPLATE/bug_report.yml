name: Bug report
description: Report something that isn't working correctly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Web
        - Multiple / all
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / OS version
      placeholder: "e.g. iPhone 15 Pro, iOS 17.5 or Pixel 8, Android 14"

  - type: input
    id: app-version
    attributes:
      label: App / Expo SDK version
      placeholder: "e.g. SDK 54"

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant error output, or drag in screenshots/screen recordings.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues to make sure this isn't a duplicate
          required: true
