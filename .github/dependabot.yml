version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # These are the packages expo-doctor/`expo install --check` validates
    # against the current Expo SDK's own pinned version ranges (see
    # node_modules/expo/bundledNativeModules.json) - bumping one on its own
    # via a Dependabot PR just gets flagged as a mismatch (or breaks at
    # runtime) until the whole SDK moves together, which only happens via a
    # deliberate `npx expo install --fix` / SDK upgrade, not a routine
    # dependency bump. @sentry/react-native is bundled there too, but it's
    # already excluded from that check on purpose (see package.json's
    # expo.install.exclude) since this project intentionally runs ahead of
    # Expo's suggested version - Dependabot should still update it normally.
    #
    # eslint is pinned for a related reason: eslint-config-expo (itself
    # pinned to this Expo SDK version) bundles eslint-plugin-import and
    # eslint-plugin-react, and neither has published a release supporting
    # ESLint 10 yet - bumping eslint alone would break linting until
    # eslint-config-expo catches up.
    ignore:
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-web"
      - dependency-name: "eslint"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
